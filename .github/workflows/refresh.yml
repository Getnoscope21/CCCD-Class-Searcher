name: Refresh live class data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm test

      - name: Scrape latest seats/status (skips descriptions -- those rarely change)
        # Env vars here are all optional -- without them the scraper still
        # refreshes course/seat data as before, it just skips emailing seat
        # alerts (see notifyOpenedSeats in src/scraper.ts and "Seat alerts
        # and the contact form" in the README). SUPABASE_SERVICE_ROLE_KEY is
        # the Supabase service_role secret, NOT the anon key used elsewhere --
        # only set it here (a GitHub Actions secret), never on the web server.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: npm run scrape -- 202670 "Fall 2026" --skip-descriptions

      - name: Checkpoint SQLite WAL into data.db
        run: |
          node -e "
            const Database = require('better-sqlite3');
            const db = new Database('data.db');
            db.pragma('wal_checkpoint(TRUNCATE)');
            db.close();
          "
          rm -f data.db-shm data.db-wal

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.db
          git diff --cached --quiet && echo "No changes" || git commit -m "Refresh live class data [skip ci]"
          git push
